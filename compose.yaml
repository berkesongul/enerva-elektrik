name: enerva-elektrik

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enerva_elektrik}
      POSTGRES_USER: ${POSTGRES_USER:-enerva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - internal

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enerva}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enerva_elektrik}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    networks:
      - internal

  admin-init:
    profiles: ["tools"]
    build:
      context: .
      target: migrator
    command: ["npx", "tsx", "prisma/create-admin.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enerva}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enerva_elektrik}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@enervaelektrik.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    mem_limit: 256m
    networks:
      - internal

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enerva}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enerva_elektrik}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: https://${DOMAIN:?DOMAIN must be set}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  uploads:
